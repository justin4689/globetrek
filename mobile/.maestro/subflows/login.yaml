# Logs in with the seeded demo account (see backend/src/seeds/user.seed.js)
appId: ${APP_ID}
---
- tapOn:
    id: "login-email"
- inputText: ${EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${PASSWORD}
# iOS has no system action to hide the keyboard; the Login button stays reachable above it
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "login-submit"
