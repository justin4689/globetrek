# Logging out returns to the login screen. Runs last because it ends the session.
appId: ${APP_ID}
name: Logout
---
- runFlow: subflows/launch.yaml

- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "profile-logout"
    direction: DOWN
- tapOn:
    id: "profile-logout"
- tapOn: "Log out" # the dialog button (its title is "Log out?")
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 15000
